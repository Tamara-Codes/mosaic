<!DOCTYPE html>
<html>
<head>
  <title>Supabase Realtime Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Supabase Realtime Test</h1>
  <div id="output"></div>

  <script>
    const SUPABASE_URL = 'https://dgfnzgtzcicsantbsqdv.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZm56Z3R6Y2ljc2FudGJzcWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzMTMzNjQsImV4cCI6MjA3ODg4OTM2NH0.W_Al1RonaFIRQWRTzRqE2dWXCMTUY1-WZjzedfDGxWo'

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const output = document.getElementById('output')

    function log(message) {
      console.log(message)
      output.innerHTML += `<p>${JSON.stringify(message)}</p>`
    }

    log('🔌 Connecting to Supabase Realtime...')

    const channel = supabaseClient
      .channel('test-channel')
      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'menu_items'
        },
        (payload) => {
          log('🎉 RECEIVED EVENT!')
          log(payload)
        }
      )
      .subscribe((status, err) => {
        if (err) {
          log(`❌ Error: ${err}`)
        }
        log(`📡 Status: ${status}`)
      })
  </script>
</body>
</html>
